# Poemas de otoño
# Fuente: https://github.com/Bernardita-Jesus/poemas-2026/tree/main/otono
# Los nombres en "fotos" son los archivos tal como aparecen en ese repositorio.

- fecha: 2026-04-20
  fecha_texto: "Lunes 20 de abril, otoño 2026"
  titulo: null
  fotos:
    - otono-08.jpg
  texto: |
    He evitado nombrar,

    concretar solo la idea,

    esa idea

    mi idea

    esta idea;

    esta que se instaura,

    carcome un susurro,

    me ensordece;

    con devoción, llegará el día en que mi rumiar se consuma.

- fecha: 2026-04-27
  fecha_texto: "Lunes 27 de abril, otoño 2026"
  titulo: null
  fotos:
    - otono-07.jpg
  texto: |
    Me encontré en ellas,

    rebozante de colores,

    rondan mi mente,

    implicantes.

    Desprevenida.

    Ayer mis ademanes te lo afirmaron;

    me hallaste, estaba oculta.

    Bajo este árbol estoy oculta,

    soy este árbol y estoy oculta,

    con entereza yo me sostengo,

    pero he notado,

    que entre los trazos, mientras me extiendo,

    no soy perenne.

- fecha: 2026-05-03
  fecha_texto: "Domingo 3 de mayo, otoño 2026"
  titulo: null
  fotos:
    - otono-01.jpg
  texto: |
    Desde mi secreto:

    afirmaste bajo la inercia,

    pulsiones,

    sentí el llamado,

    de este secreto que me exige que me arme,

    que corra

    que corra a ocultarlo.

    A enterrarlo en los áridos,

    atrás de las puertas,

    bajo estas escaleras,

    que se enmarañan,

    ahí está

    ahí lo oculté.

- fecha: 2026-05-23
  fecha_texto: "Sábado 23 de mayo, otoño 2026"
  titulo: null
  fotos:
    - otono-04.jpg
  texto: |
    Debo ser cautelosa con mis palabras,

    me tienen aquí sumida,

    algo apacible en mí se prepara,

    resiste en esta implicancia;

    ¿Queda algún vestigio de amor?

    Vestigio,

    algún vestigio de ti.

- fecha: 2026-05-28
  fecha_texto: "Jueves 28 de mayo, otoño 2026"
  titulo: null
  fotos:
    - otono-06.jpg
  texto: |
    Se ramificaron aquellas sentencias,

    y mis añoranzas;

    no hay ninguna parte de mí,

    que crea que esto es lo correcto.

    Quiero besarte como si te dijera que te amara.

- fecha: 2026-06-04
  fecha_texto: "Jueves 04 de junio, otoño 2026"
  titulo: null
  fotos:
    - otono-09.jpg
  texto: |
    Me quiero ahogar en este frío de la mañana,

    y desde la mañana,

    quiero quedarme inmóvil en este no creer,

    quiero quedarme inmóvil,

    quiero creer

    que

    estarás

    mañana.

- fecha: 2026-06-08
  fecha_texto: "Lunes 08 de junio, otoño 2026"
  titulo: null
  fotos:
    - otono-11.jpeg
  texto: |
    Mis sentimientos son inefables,

    siento esta incomprensión casi espiritual.

- fecha: 2026-06-19
  fecha_texto: "Viernes 19 de junio, otoño 2026"
  titulo: null
  fotos:
    - otono-12.jpeg
    - otono-10.jpeg
  texto: |
    La tierra se acongoja,

    esta elipse de la mañana,

    solo pronuncia lo corroído de mi pasar.
