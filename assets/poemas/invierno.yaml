# Poemas de invierno
# Fuente: https://github.com/Bernardita-Jesus/poemas-2026/tree/main/invierno
# Los nombres en "fotos" son los archivos tal como aparecen en ese repositorio.

- fecha: 2026-06-22
  fecha_texto: "Lunes 22 de junio, invierno 2026"
  titulo: null
  fotos: []
  texto: |
    Cada decisión me parece intrascendente,

    siento este invierno azul,

    extenuante;

    cada decisión,

    y yo sola,

    en este incomprensible invierno;

    cada decisión,

    borraste todos los colores.

- fecha: 2026-06-25
  fecha_texto: "Jueves 25 de junio, invierno 2026"
  titulo: null
  fotos:
    - invierno-01.jpg
  texto: |
    En esta temporada,

    habito un viacrucis,

    sepúltenme,

    en mi camino de devoción;

    sepúltenme entre retoños.

- fecha: 2026-06-28
  fecha_texto: "Domingo 28 de junio, invierno 2026"
  titulo: null
  fotos: []
  texto: |
    Hazme parte de cada fractal que conforma mi reflejo,

    hazme parte,

    fúndamentame.

- fecha: 2026-06-29
  fecha_texto: "Lunes 29 de junio, invierno 2026"
  titulo: null
  fotos:
    - invierno-04.jpg
  texto: |
    Nunca desperté,

    recorro laberintos,

    entro por una y otra puerta,

    cada vez más adentro,

    y no logro conciliar esta certidumbre.

- fecha: 2026-07-05
  fecha_texto: "Domingo 05 de julio, invierno 2026"
  titulo: null
  fotos:
    - invierno-02.jpg
  texto: |
    Mi secreto:

    Son pulsiones,

    son suspiros,

    son colores,

    cada día, y el anterior, en la mañana.

- fecha: 2026-07-16
  fecha_texto: "Jueves 16 de julio, invierno 2026"
  titulo: null
  fotos:
    - invierno-05.jpg
  texto: |
    Nunca formaré parte de lo mismo,

    este propósito,

    me aglomero a esto,

    una suerte de yo,

    a esto;

    ya no recuerdo el engaño,

    no comprendí esta sentencia,

    me incrusté entre la aspereza.

- fecha: 2026-07-18
  fecha_texto: "Sábado 18 de julio, invierno 2026"
  titulo: null
  fotos: []
  texto: |
    Mi madre me preguntó por qué no reaccionaba;

    mi estado feroz,

    está sumido.

- fecha: 2026-07-19
  fecha_texto: "Domingo 19 de julio, invierno 2026"
  titulo: null
  fotos:
    - invierno-07.jpg
  texto: |
    Siento este engaño,

    no quiero pensar significancias,

    no creí que te correspondieran,

    no creí.

    Se consume el aire en el desconocimiento,

    tu recuerdo es una ternura que va a acabar con mi quehacer.

- fecha: 2026-07-21
  fecha_texto: "Martes 21 de julio, invierno 2026"
  titulo: null
  fotos: []
  texto: |
    Estas ideas devastadoras,

    me inmovilizan,

    para no tener que hacerme cargo de esta vida.

- fecha: 2026-07-28
  fecha_texto: "Martes 28 de julio, invierno 2026"
  titulo: null
  fotos:
    - invierno-03.jpg
  texto: |
    Siento el apuro de hacer mis palabras más pequeñas,

    existen en la limerencia;

    desde esta ingenuidad

    en la que te gustaba habitarme.

- fecha: 2026-07-31
  fecha_texto: "Viernes 31 de julio, invierno 2026"
  titulo: null
  fotos:
    - invierno-09.jpg
  texto: |
    Como si lo hubieras escogido,

    hoy todo me parece hostil,

    se pronuncian punzantes,

    como si lo hubieras escogido;

    si todo se tratara de mí,

    vivirías de la certeza,

    en el lecho de mis ideas.

- fecha: 2026-08-01
  fecha_texto: "Sábado 01 de agosto, invierno 2026"
  titulo: null
  fotos:
    - invierno-06.jpg
  texto: |
    Debo repetir mis temas a ver si en mis palabras encuentro la concepción;

    debo repetir los temas

    a ver si en las palabras encuentro,

    si en las palabras te encuentro,

    si te descifro,

    si descifro esto.

    Debo descifrar las palabras,

    los vestigios de lo que fueron tus ideas

    con las que soñaste,

    a ver si en tus sueños me encuentro;

    puedo soportar ser solo parte de tus sueños,

    debo repetir los sueños

    hasta que dejen de dolerme,

    porque no hay nada más que descifrar,

    ya indagué cada palabra,

    y no logro encontrarme en esta repetición.

- fecha: 2026-08-02
  fecha_texto: "Domingo 02 de agosto, invierno 2026"
  titulo: null
  fotos:
    - invierno-11.jpg
  texto: |
    Podría dejar de ser parte incluso de todo,

    y nadie extrañaría mis ademanes.

    En este intento de permanecer,

    me doy cuenta de que nunca soy suficientemente parte de algo.

    Siempre estoy en la excepción,

    la consulta,

    el dilema.

    En este intento de permanecer,

    he construido un universo en donde hundirme,

    para que puedan recorrerme,

    cuando me sumerja por completo.

- fecha: 2026-08-12
  fecha_texto: "Miércoles 12 de agosto, invierno 2026"
  titulo: null
  fotos:
    - invierno-08.jpg
  texto: |
    quería aferrarme a algo,

    aunque sea a este invierno que me inmoviliza,

    por supuesto que fue a lo incorrecto,

    soy incapaz,

    fui;

    quiero detenerme en la excepción,

    y en cada gesto colmado de indecisión.

- fecha: 2026-08-12
  fecha_texto: "Miércoles 12 de agosto, invierno 2026"
  titulo: "Hasta que no sea yo"
  fotos: []
  texto: |
    cambiaría cada palabra que escogí,

    ocultaría cada miedo,

    dejaría de comunicar mis ideas con soltura,

    escondería cada acto de amor

    que denote lo mucho que quería estar a tu lado.

- fecha: 2026-08-13
  fecha_texto: "Jueves 13 de agosto, invierno 2026"
  titulo: null
  fotos:
    - invierno-09.jpg
  texto: |
    Me gustaría envolverme en una arboleda,

    quiero que mis ideas se enmarañen sobre mí;

    si me vieran enraizada, no cuestionarían en dónde me hallo.

- fecha: 2026-08-16
  fecha_texto: "Domingo 16 de agosto, invierno 2026"
  titulo: null
  fotos:
    - invierno-10.jpg
  texto: |
    Entiendo que no tenga que arrastrarte a esto,

    pero incluso ahí, no serías capaz de entenderme;

    me gusta recostarme a tu lado,

    hay una pequeña parte de mí que cree que podríamos compartir nuestras vidas,

    pero eres alguien despreocupado, en el mejor de los sentidos,

    y yo soy alguien que se siente cómoda habitando mis complejidades.

- fecha: 2026-08-22
  fecha_texto: "Sábado 22 de agosto, invierno 2026"
  titulo: null
  fotos: []
  texto: |
    Esto invoca

    y no estoy lista para despertar en un clima que no me pertenece,

    en una suerte de temporada,

    de manifestaciones equívocas.

- fecha: 2026-08-25
  fecha_texto: "Martes 25 de agosto, invierno 2026"
  titulo: null
  fotos: []
  texto: |
    Entonces me llega tu recuerdo y mi cuerpo se retuerce en esta incomprensión,

    se retuerce.

    Temo detenerme a habitar lo feroz de tu recuerdo.

- fecha: 2026-08-26
  fecha_texto: "Miércoles 26 de agosto, invierno 2026"
  titulo: null
  fotos: []
  texto: |
    me extiendo en lo inoportuno

    me retracto,

    no llegué a pronunciar mis ideas

    porque no caben en esta sala,

    y se quedan esperando,

    justo afuera,

    se hacen espacio como pueden

    y se recuestan a mi lado.

- fecha: 2026-08-29
  fecha_texto: "Sábado 29 de agosto, invierno 2026"
  titulo: null
  fotos: []
  texto: |
    me he dedicado a convertir espacios de mí

    en una narrativa extremadamente personal,

    porque estaría dispuesta a perderme por ti,

    mentiría sin dudar,

    me abandonaría por completo

    para volver a sentirme entendida;

    para poder mirarte,

    admirarte

    por varios segundos

    sin habitar esta devastadora pena que me dejó tu abandono.
